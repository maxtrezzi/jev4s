# ADR-0008 wants zero unexplained survivors. Stryker4s requires low > break, so break tops out at
# 99, which lets one survivor through once a module has more than 100 mutants. The JSON report is
# therefore checked by build/check-mutants.py, which fails on any survivor.
stryker4s {
  thresholds { high = 100, low = 100, break = 99 }
  reporters = ["console", "html", "json"]
}
