name: release

# A release is a squashed pull request from dev to main whose subject is the version, and that
# commit on main gets the tag v<version> (ADR-0013). The tag starts this workflow, which publishes
# the four artifacts to Maven Central through the Central Portal (ADR-0051).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    name: publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The jar uses only JDK 17's API whatever JDK builds it (-release 17 in build.sbt); the
      # release is built on 17 as well, the oldest JDK that jev4s supports.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # A version on Maven Central can never be changed or deleted, so nothing is published from a
      # commit that is not on main.
      - name: The tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # The version is written in build.sbt, and the release pull request sets it. Every published
      # project must carry it, and it must be the version of the tag.
      - name: The tag is the version of every published project
        run: |
          versions=$(sbt -batch --error 'print ThisBuild / version' | grep -P '^\t' | tr -d '\t' | sort -u)
          echo "tag: $GITHUB_REF_NAME, build: $versions"
          test "$versions" = "${GITHUB_REF_NAME#v}"
      - name: Test
        run: sbt -batch test
      - name: Compatibility with the previous releases (ADR-0052)
        run: sbt -batch mimaReportBinaryIssues scala3/tastyMiMaReportIssues
      - name: Import the signing key
        run: echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
      # publishSigned stages the signed artifacts in target/sona-staging; sonaRelease uploads them
      # to the Central Portal and releases them. sbt reads the Portal token from SONATYPE_USERNAME
      # and SONATYPE_PASSWORD, and sbt-pgp the key's passphrase from PGP_PASSPHRASE.
      - name: Publish
        run: sbt -batch publishSigned sonaRelease
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
