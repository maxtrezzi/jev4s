name: build

on:
  # dev receives work and main receives releases, so both are gated (ADR-0013).
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # One config, two dialects (.scalafmt.conf). The live projects are not aggregated by the
      # root, so they are checked by name.
      - name: Check formatting
        run: sbt -batch scalafmtCheckAll scalafmtSbtCheck scala3Live/scalafmtCheckAll scala213Live/scalafmtCheckAll scala213Spark/scalafmtCheckAll

  test:
    # The modules share no code (ADR-0009): each is tested on its own, on both supported JDKs.
    name: test ${{ matrix.module }} on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [scala3, scala213]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The live project is compiled, and only the tests of the guides run (package guide): they
      # use a fake transport or a local server. LiveSuite calls the paid API, and never runs here.
      # Scaladoc is built too: a comment it cannot read fails publishLocal, and no test sees it.
      - name: Test, build the Scaladoc, compile the live project, and run the guides' tests
        run: sbt -batch "project ${{ matrix.module }}" test doc "${{ matrix.module }}Live/testOnly guide.*"
      # The Spark example (M8) runs Spark in local mode against a fake transport or a local server.
      - name: Test the Spark example
        if: matrix.module == 'scala213'
        run: sbt -batch scala213Spark/test

  coverage:
    # ADR-0008: below 100% statement or branch coverage the build fails.
    name: coverage ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [scala3, scala213]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test with coverage
        run: sbt -batch "project ${{ matrix.module }}" clean coverage test coverageReport
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/target/scala-*/scoverage-report/
          if-no-files-found: ignore

  mutation:
    # On every pull request (ADR-0018).
    name: mutation ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [scala3, scala213]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Stryker4s puts its test runner, built with scala-library 2.13.18, on the classpath of the
      # 2.13 module, and sbt stops a 2.13.16 build that sees a newer library (SIP-51). The setting
      # allows it for this run only; the other jobs keep the check that guards ADR-0036.
      - name: Mutation testing
        run: sbt -batch "project ${{ matrix.module }}" "set scala213 / allowUnsafeScalaLibUpgrade := true" clean stryker
      # Stryker's break threshold cannot exceed 99; this fails on any undetected mutant, and on a
      # mutant Stryker4s ignored without a @SuppressWarnings (ADR-0016, ADR-0024).
      - name: No undetected mutant
        run: python3 build/check-mutants.py ${{ matrix.module }}
      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.module }}
          path: ${{ matrix.module }}/target/stryker4s-report/
          if-no-files-found: ignore

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      # The checker resolves links against `git ls-files`, not the file system: a target that
      # is git-ignored resolves on a contributor's machine and fails for everyone who clones.
      - uses: actions/checkout@v7

      - name: Check ADR status lines, the index, and every link
        run: python3 build/check-docs.py
