name: build

on:
  # dev receives work and main receives releases, so both are gated (ADR-0013).
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  module:
    # One job per module: the modules share no code (ADR-0009), and each must meet the
    # definition of done on its own (ADR-0008).
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [scala3, scala213]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Tests with coverage instrumentation; the build fails below 100% statements or branches.
      - name: Test and coverage
        run: sbt -batch "project ${{ matrix.module }}" clean coverage test coverageReport

      # Stryker compiles its own instrumented copy, so the coverage build must not be reused.
      - name: Mutation testing
        run: sbt -batch "project ${{ matrix.module }}" clean stryker

      # Stryker's break threshold cannot exceed 99; this fails on any undetected mutant.
      - name: No undetected mutant
        run: python3 build/check-mutants.py ${{ matrix.module }}

      - name: Keep the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-${{ matrix.module }}
          path: ${{ matrix.module }}/target/stryker4s-report/
          if-no-files-found: ignore

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    steps:
      # The checker resolves links against `git ls-files`, not the file system: a target that
      # is git-ignored resolves on a contributor's machine and fails for everyone who clones.
      - uses: actions/checkout@v4

      - name: Check ADR status lines, the index, and every link
        run: python3 build/check-docs.py
