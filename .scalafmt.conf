# One configuration, two dialects: each module is formatted as the Scala it is written in
# (ADR-0009). CI fails on unformatted code: `sbt scalafmtCheckAll scalafmtSbtCheck`.
version = 3.11.5
runner.dialect = scala3
maxColumn = 120

align.preset = more
docstrings.style = SpaceAsterisk
docstrings.wrap = no
trailingCommas = multiple

fileOverride {
  "glob:**/scala213/**" {
    runner.dialect = scala213
    trailingCommas = never
  }
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
}
